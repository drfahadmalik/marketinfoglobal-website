<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Info Global — Coming Soon</title>
<style>

  :root{
    --ink:#0E1A2B;
    --panel-line:#2A3E56;
    --parchment:#EDE7DA;
    --parchment-dim:#8FA0B5;
    --green:#4FA88F;
    --gold:#C9A24B;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    background:var(--ink);
    color:var(--parchment);
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
  }

  .card{
    max-width:520px;
  }

  .mark-icon{
    margin-bottom:34px;
    animation:draw 1400ms ease-out;
  }

  @keyframes draw{
    from{opacity:0; transform:translateY(-6px);}
    to{opacity:1; transform:translateY(0);}
  }

  h1{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-weight:400;
    font-size:38px;
    letter-spacing:0.2px;
    line-height:1.15;
  }

  h1 em{
    font-style:normal;
    color:var(--green);
  }

  .sub{
    font-family:"Consolas","SFMono-Regular",Menlo,monospace;
    font-size:11px;
    letter-spacing:2.5px;
    color:var(--gold);
    margin-top:10px;
  }

  .divider{
    width:48px;
    height:1px;
    background:var(--panel-line);
    margin:34px auto;
  }

  p.status{
    font-size:19px;
    color:var(--parchment-dim);
  }

  @media (prefers-reduced-motion: reduce){
    .mark-icon{animation:none;}
  }

</style>
</head>
<body>

  <div class="card">
    <svg class="mark-icon" width="52" height="52" viewBox="0 0 34 34" fill="none">
      <circle cx="17" cy="17" r="15.5" stroke="#C9A24B" stroke-width="1.1"/>
      <path d="M2.5 17H31.5" stroke="#2A3E56" stroke-width="0.8"/>
      <path d="M17 2 C10 8, 10 26, 17 32" stroke="#2A3E56" stroke-width="0.8" fill="none"/>
      <path d="M17 2 C24 8, 24 26, 17 32" stroke="#2A3E56" stroke-width="0.8" fill="none"/>
      <path d="M7 21 L13 15 L18 19 L27 9" stroke="#4FA88F" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21 9 L27 9 L27 15" stroke="#4FA88F" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <h1>Market <em>Info</em> Global</h1>
    <div class="sub">GLOBAL</div>

    <div class="divider"></div>

    <p class="status">Coming soon.</p>
  </div>

</body>
</html>
