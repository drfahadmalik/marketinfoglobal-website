<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Info Global — Coming Soon</title>
<style>

  :root{
    --bg:#050608;
    --parchment:#F1EFE9;
    --parchment-dim:#8B93A0;
    --blue:#3E6FD9;
    --red:#C0342A;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    background:var(--bg);
    color:var(--parchment);
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
    background-image:
      radial-gradient(circle at 30% 20%, rgba(62,111,217,0.12), transparent 45%),
      radial-gradient(circle at 70% 80%, rgba(192,52,42,0.12), transparent 45%);
    position:relative;
    overflow:hidden;
  }

  .sky{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
  }

  .grid-line{
    position:absolute;
    left:0;
    right:0;
    height:1px;
    background:rgba(255,255,255,0.045);
  }

  .grid-line.v{
    top:0;
    bottom:0;
    left:auto;
    right:auto;
    width:1px;
    height:auto;
  }

  .chart-line{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .chart-line path{
    fill:none;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .chart-line .line-blue{
    stroke:#3E6FD9;
    filter:drop-shadow(0 0 6px rgba(62,111,217,0.55));
    stroke-dasharray:6 2400;
    animation:drawline 9s linear infinite;
  }

  .chart-line .line-red{
    stroke:#C0342A;
    filter:drop-shadow(0 0 6px rgba(192,52,42,0.5));
    stroke-dasharray:6 2400;
    animation:drawline 9s linear infinite;
    animation-delay:1.6s;
  }

  @keyframes drawline{
    0%{stroke-dashoffset:0; opacity:0;}
    3%{opacity:1;}
    92%{opacity:1;}
    100%{stroke-dashoffset:-2400; opacity:0;}
  }

  .candles{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:38%;
    display:flex;
    align-items:flex-end;
    gap:22px;
    padding:0 4%;
    opacity:0.5;
    -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    mask-image:linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  }

  .candle{
    width:6px;
    border-radius:1px;
    transform-origin:bottom;
    animation:pulse-candle 4.5s ease-in-out infinite;
  }

  @keyframes pulse-candle{
    0%, 100%{transform:scaleY(0.75);}
    50%{transform:scaleY(1);}
  }

  .particle{
    position:absolute;
    border-radius:50%;
    animation:rise linear infinite;
  }

  @keyframes rise{
    0%{transform:translateY(0); opacity:0;}
    10%{opacity:0.8;}
    90%{opacity:0.5;}
    100%{transform:translateY(-70vh); opacity:0;}
  }

  @media (prefers-reduced-motion: reduce){
    .chart-line .line-blue, .chart-line .line-red, .candle, .particle{animation:none; display:none;}
  }

  .card{
    max-width:420px;
    position:relative;
    z-index:2;
  }

  .logo{
    width:220px;
    height:220px;
    border-radius:50%;
    object-fit:cover;
    animation:reveal 900ms ease-out, float 3.6s ease-in-out 900ms infinite;
    box-shadow:0 0 0 1px rgba(255,255,255,0.06), 0 30px 60px rgba(0,0,0,0.5);
  }

  @keyframes reveal{
    from{opacity:0; transform:scale(0.96);}
    to{opacity:1; transform:scale(1);}
  }

  @keyframes float{
    0%, 100%{transform:translateY(0);}
    50%{transform:translateY(-14px);}
  }

  @media (prefers-reduced-motion: reduce){
    .logo{animation:none;}
  }

  .divider{
    width:60px;
    height:2px;
    margin:36px auto;
    background:linear-gradient(90deg, var(--blue), var(--red));
  }

  p.status{
    font-family:"Consolas","SFMono-Regular",Menlo,monospace;
    font-size:13px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--parchment-dim);
  }

  p.status em{
    font-style:normal;
    color:var(--parchment);
  }

  @media (max-width:480px){
    .logo{width:170px;height:170px;}
  }

</style>
</head>

    const sky = document.getElementById('sky');
    const candleWrap = document.getElementById('candles');

    // Background candlesticks
    const candleCount = 46;
    for(let i = 0; i < candleCount; i++){
      const c = document.createElement('div');
      c.className = 'candle';
      const h = 14 + Math.random() * 86;
      c.style.height = h + '%';
      c.style.background = Math.random() > 0.5 ? '#3E6FD9' : '#C0342A';
      c.style.animationDelay = (Math.random() * 4.5) + 's';
      c.style.animationDuration = (3.5 + Math.random() * 2.5) + 's';
      candleWrap.appendChild(c);
    }

    // Rising particles (like market data points)
    for(let i = 0; i < 26; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 2 + Math.random() * 2.5;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.bottom = (Math.random() * 20) + 'vh';
      p.style.background = Math.random() > 0.5 ? '#3E6FD9' : '#C0342A';
      p.style.boxShadow = '0 0 6px currentColor';
      p.style.animationDuration = (8 + Math.random() * 10) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      sky.appendChild(p);
    }
  </script>

</body>
</html>
