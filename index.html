<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Info Global — Coming Soon</title>
<style>

  :root{
    --bg:#050608;
    --parchment:#F1EFE9;
    --parchment-dim:#8B93A0;
    --blue:#3E6FD9;
    --red:#C0342A;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    background:var(--bg);
    color:var(--parchment);
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
    background-image:
      radial-gradient(circle at 30% 20%, rgba(62,111,217,0.12), transparent 45%),
      radial-gradient(circle at 70% 80%, rgba(192,52,42,0.12), transparent 45%);
  }

  .card{
    max-width:420px;
  }

  .logo{
    width:220px;
    height:220px;
    border-radius:50%;
    object-fit:cover;
    animation:reveal 900ms ease-out, float 3.6s ease-in-out 900ms infinite;
    box-shadow:0 0 0 1px rgba(255,255,255,0.06), 0 30px 60px rgba(0,0,0,0.5);
  }

  @keyframes reveal{
    from{opacity:0; transform:scale(0.96);}
    to{opacity:1; transform:scale(1);}
  }

  @keyframes float{
    0%, 100%{transform:translateY(0);}
    50%{transform:translateY(-14px);}
  }

  @media (prefers-reduced-motion: reduce){
    .logo{animation:none;}
  }

  .divider{
    width:60px;
    height:2px;
    margin:36px auto;
    background:linear-gradient(90deg, var(--blue), var(--red));
  }

  p.status{
    font-family:"Consolas","SFMono-Regular",Menlo,monospace;
    font-size:13px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--parchment-dim);
  }

  p.status em{
    font-style:normal;
    color:var(--parchment);
  }

  @media (max-width:480px){
    .logo{width:170px;height:170px;}
  }

</style>
</head>
